<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC+ | Servicios para tu computador - ERP/CRM</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#D90429',
                        secondary: '#8D99AE',
                        darkBg: '#1A1A1D',
                        lightText: '#F8F9FA',
                        lightGrayBg: '#E5E5E5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-lightText font-sans min-h-screen flex flex-col md:flex-row">

    <!-- MENÚ LATERAL (IZQUIERDA) - FONDO ROJO ELÉCTRICO -->
    <aside class="w-full md:w-72 bg-primary flex flex-col shadow-2xl justify-between shrink-0">
        <div>
            <!-- Header del Menú con Logo y Slogan -->
            <div class="p-6 text-center border-b border-red-700/50">
                <div class="inline-block p-2 bg-darkBg rounded-full shadow-lg mb-3">
                    <i class="fa-solid fa-microchip text-primary text-3xl"></i>
                </div>
                <h1 class="font-heading font-extrabold text-2xl tracking-wider text-white">PC+</h1>
                <p class="text-xs text-red-100 italic mt-1 font-medium">Servicios para tu computador</p>
                <p class="text-[10px] text-red-200 mt-0.5"><i class="fa-solid fa-location-dot"></i> Pereira, Risaralda</p>
            </div>

            <!-- Selector de Modo (Admin / Público General) -->
            <div class="p-4 bg-red-800/40 border-b border-red-700/50 flex items-center justify-between">
                <span class="text-xs font-semibold text-white uppercase tracking-wider">Modo Vista:</span>
                <select id="roleSelector" onchange="switchRole(this.value)" class="bg-darkBg text-white text-xs px-2 py-1 rounded border border-red-500 focus:outline-none">
                    <option value="admin">Administrador</option>
                    <option value="public">Público General</option>
                </select>
            </div>

            <!-- Navegación -->
            <nav class="p-4 space-y-2" id="mainNav">
                <a href="#" onclick="navigate('dashboard')" id="nav-dashboard" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-white hover:bg-red-700 transition font-medium text-sm">
                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                </a>
                <a href="#" onclick="navigate('clients')" id="nav-clients" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-white hover:bg-red-700 transition font-medium text-sm">
                    <i class="fa-solid fa-users w-5"></i> Base de Clientes
                </a>
                <a href="#" onclick="navigate('services')" id="nav-services" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-white hover:bg-red-700 transition font-medium text-sm">
                    <i class="fa-solid fa-screwdriver-wrench w-5"></i> Solicitudes y Servicios
                </a>
                <a href="#" onclick="navigate('catalog')" id="nav-catalog" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-white hover:bg-red-700 transition font-medium text-sm">
                    <i class="fa-solid fa-tags w-5"></i> Catálogo y Precios
                </a>
                <a href="#" onclick="navigate('contact')" id="nav-contact" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-white hover:bg-red-700 transition font-medium text-sm">
                    <i class="fa-solid fa-headset w-5"></i> Contacto
                </a>
            </nav>
        </div>

        <div class="p-4 text-center text-xs text-red-200 border-t border-red-700/50">
            &copy; 2026 PC+ ERP Systems
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto max-h-screen">
        
        <!-- Header Superior con consecutivo y buscador global -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 mb-6 border-b border-gray-800 gap-4">
            <div>
                <h2 id="pageTitle" class="font-heading font-bold text-3xl text-white">Dashboard</h2>
                <p id="pageSubtitle" class="text-secondary text-sm">Panel general de control y supervisión técnica</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="px-3 py-1 bg-gray-800 text-secondary text-xs rounded-full border border-gray-700">
                    <i class="fa-solid fa-shield-halved text-primary mr-1"></i> <span id="currentRoleBadge">Modo Administrador</span>
                </span>
            </div>
        </header>

        <!-- CONTENEDOR DE MÓDULOS -->
        <div id="appContainer">
            <!-- Inyectado dinámicamente mediante JS -->
        </div>

    </main>

    <!-- MODAL GENERAL PARA IMÁGENES / TICKETS -->
    <div id="globalModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-gray-800 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modalContent">
                <!-- Contenido dinámico del modal -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT DE LÓGICA Y ESTADO -->
    <script>
        // ESTADO GLOBAL EN MEMORIA / LOCALSTORAGE
        let appState = {
            role: 'admin',
            activeTab: 'dashboard',
            clients: JSON.parse(localStorage.getItem('pc_clients')) || [
                { id: 1, name: 'Carlos Mario Gómez', phone: '3112345678', email: 'carlos@gmail.com', address: 'Calle 14 # 23-45', city: 'Pereira', type: 'Cliente', notes: 'Cliente frecuente' },
                { id: 2, name: 'Ana Sofía Restrepo', phone: '3009876543', email: 'ana@yahoo.es', address: 'Av. Circunvalar # 5-10', city: 'Pereira', type: 'Prospecto', notes: 'Interesada en mantenimiento de portátil' }
            ],
            services: JSON.parse(localStorage.getItem('pc_services')) || [
                {
                    id: 101,
                    clientId: 1,
                    type: 'Presencial',
                    date: '2026-11-02',
                    time: '10:00',
                    status: 'En Proceso',
                    selectedCatalogIds: [3, 5], // Limpieza hardware, Mantenimiento Estándar
                    receptionChecklist: {
                        equipType: 'Portátil', brand: 'Asus', model: 'ZenBook 14', serial: 'AS987654321',
                        os: 'Windows 11 Pro', pass: '1234', symptoms: 'Lentitud extrema y ruido en ventilador.', notes: 'Rayón leve en tapa superior.',
                        items: {
                            chasis: { na: false, note: 'Buen estado' },
                            pantalla: { na: false, note: 'Sin pixeles muertos' }
                        }
                    },
                    departureChecklist: null
                }
            ],
            catalogServices: [
                { id: 1, name: 'Servicio en Domicilio del Cliente', price: 20000, img: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=300', desc: 'Desplazamiento a domicilio en Pereira.' },
                { id: 2, name: 'Capacitaciones Personalizadas', price: 25000, img: 'https://images.unsplash.com/photo-1531482615713-2afd69097998?w=300', desc: 'Clases en Excel, Office y Google Workspace.' },
                { id: 3, name: 'Limpieza de Hardware', price: 30000, img: 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=300', desc: 'Limpieza interna y externa de componentes.' },
                { id: 4, name: 'Mantenimiento Estándar - Remoto', price: 40000, img: 'https://images.unsplash.com/photo-1591488320449-011701bb6704?w=300', desc: 'Optimización remota por AnyDesk/TeamViewer.' },
                { id: 5, name: 'Mantenimiento Estándar', price: 50000, img: 'https://images.unsplash.com/photo-1555680202-c86f0e12f086?w=300', desc: 'Diagnóstico, optimización y drivers.' },
                { id: 6, name: 'Reviva su PC Viejo', price: 60000, img: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=300', desc: 'Puesta a punto para equipos antiguos.' },
                { id: 7, name: 'Recuperación y/o Restauración de Información', price: 60000, img: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?w=300', desc: 'Rescate seguro de archivos y datos.' },
                { id: 8, name: 'Repotencie su Computador', price: 60000, img: 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=300', desc: 'Instalación de SSD y ampliación de RAM.' },
                { id: 9, name: 'Reinstalación de Windows y Puesta a Punto del PC', price: 80000, img: 'https://images.unsplash.com/photo-1629654297299-c8506221ca97?w=300', desc: 'Formateo y configuración limpia de sistema operativo.' }
            ],
            catalogProducts: [
                { id: 101, name: 'Venta de Licencias de Software', price: 50000, img: 'https://images.unsplash.com/photo-1618401471353-b98aedd04e11?w=300', desc: 'Licenciamiento original y seguro.' },
                { id: 102, name: 'Venta de Partes y Accesorios', price: 45000, img: 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300', desc: 'Periféricos, cables, discos SSD y memorias.' }
            ]
        };

        function saveData() {
            localStorage.setItem('pc_clients', JSON.stringify(appState.clients));
            localStorage.setItem('pc_services', JSON.stringify(appState.services));
        }

        function switchRole(role) {
            appState.role = role;
            document.getElementById('currentRoleBadge').innerText = role === 'admin' ? 'Modo Administrador' : 'Público General';
            
            // Restringir navegación si es público general
            const navClients = document.getElementById('nav-clients');
            const navServices = document.getElementById('nav-services');
            const navDashboard = document.getElementById('nav-dashboard');

            if (role === 'public') {
                navClients.style.display = 'none';
                navServices.style.display = 'none';
                navDashboard.style.display = 'none';
                navigate('catalog');
            } else {
                navClients.style.display = 'flex';
                navServices.style.display = 'flex';
                navDashboard.style.display = 'flex';
                navigate('dashboard');
            }
        }

        function navigate(tab) {
            if (appState.role === 'public' && tab !== 'catalog' && tab !== 'contact') {
                alert('Acceso restringido para el público general. Solo puede visualizar Catálogos y Contacto.');
                return;
            }
            appState.activeTab = tab;
            render();
        }

        function render() {
            const container = document.getElementById('appContainer');
            const titleEl = document.getElementById('pageTitle');
            const subtitleEl = document.getElementById('pageSubtitle');

            // Actualizar clases activas del menú
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('bg-red-700', 'shadow'));
            const activeNav = document.getElementById(`nav-${appState.activeTab}`);
            if (activeNav) activeNav.classList.add('bg-red-700', 'shadow');

            switch(appState.activeTab) {
                case 'dashboard':
                    titleEl.innerText = 'Dashboard Principal';
                    subtitleEl.innerText = 'Resumen general de operaciones de soporte técnico PC+';
                    container.innerHTML = renderDashboard();
                    break;
                case 'clients':
                    titleEl.innerText = 'Base de Datos de Clientes';
                    subtitleEl.innerText = 'Gestión de clientes y prospectos registrados';
                    container.innerHTML = renderClients();
                    break;
                case 'services':
                    titleEl.innerText = 'Solicitudes y Servicios';
                    subtitleEl.innerText = 'Control de órdenes de servicio, estados y seguimientos';
                    container.innerHTML = renderServices();
                    break;
                case 'catalog':
                    titleEl.innerText = 'Catálogo de Servicios y Productos';
                    subtitleEl.innerText = 'Tarifas base vigentes en Pesos Colombianos (COP)';
                    container.innerHTML = renderCatalog();
                    break;
                case 'contact':
                    titleEl.innerText = 'Contacto y Ubicación';
                    subtitleEl.innerText = 'Información oficial de atención al cliente';
                    container.innerHTML = renderContact();
                    break;
            }
        }

        // ================= MÓDULO DASHBOARD =================
        function renderDashboard() {
            const pending = appState.services.filter(s => s.status === 'Pendiente').length;
            const inProgress = appState.services.filter(s => s.status === 'En Proceso').length;
            const completed = appState.services.filter(s => s.status === 'Realizado').length;
            const cancelled = appState.services.filter(s => s.status === 'Cancelado').length;
            const totalClients = appState.clients.length;
            const prospects = appState.clients.filter(c => c.type === 'Prospecto').length;
            
            // Ingresos estimados mes (suma de servicios realizados)
            let estimatedIncome = 0;
            appState.services.filter(s => s.status === 'Realizado').forEach(s => {
                s.selectedCatalogIds.forEach(catId => {
                    const item = appState.catalogServices.find(c => c.id === catId);
                    if (item) estimatedIncome += item.price;
                });
            });

            return `
                <div class="space-y-6">
                    <!-- Tarjetas de Estadísticas -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl shadow-lg border-l-4 border-l-yellow-500">
                            <p class="text-xs text-secondary font-medium">Servicios Pendientes</p>
                            <h3 class="text-3xl font-bold font-heading text-white mt-1">${pending}</h3>
                        </div>
                        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl shadow-lg border-l-4 border-l-blue-500">
                            <p class="text-xs text-secondary font-medium">En Proceso / Taller</p>
                            <h3 class="text-3xl font-bold font-heading text-white mt-1">${inProgress}</h3>
                        </div>
                        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl shadow-lg border-l-4 border-l-green-500">
                            <p class="text-xs text-secondary font-medium">Realizados este Mes</p>
                            <h3 class="text-3xl font-bold font-heading text-white mt-1">${completed}</h3>
                        </div>
                        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl shadow-lg border-l-4 border-l-primary">
                            <p class="text-xs text-secondary font-medium">Ingresos Estimados (COP)</p>
                            <h3 class="text-2xl font-bold font-heading text-white mt-1">$ ${estimatedIncome.toLocaleString()}</h3>
                        </div>
                    </div>

                    <!-- Métricas Secundarias de Clientes -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex items-center justify-between">
                            <div>
                                <p class="text-xs text-secondary">Total Clientes Registrados</p>
                                <h4 class="text-xl font-bold text-white">${totalClients}</h4>
                            </div>
                            <i class="fa-solid fa-users text-2xl text-secondary"></i>
                        </div>
                        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex items-center justify-between">
                            <div>
                                <p class="text-xs text-secondary">Prospectos Activos</p>
                                <h4 class="text-xl font-bold text-white">${prospects}</h4>
                            </div>
                            <i class="fa-solid fa-user-plus text-2xl text-primary"></i>
                        </div>
                    </div>

                    <!-- Accesos Rápidos -->
                    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-lg">
                        <h3 class="font-heading font-bold text-lg text-white mb-4"><i class="fa-solid fa-bolt text-primary mr-2"></i> Accesos Rápidos</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                            <button onclick="openClientModal()" class="p-3 bg-zinc-800 hover:bg-primary/20 border border-zinc-700 hover:border-primary rounded-lg text-left transition group">
                                <i class="fa-solid fa-user-plus text-primary text-lg mb-2 block"></i>
                                <span class="text-xs font-semibold text-white group-hover:text-primary">Registrar Cliente</span>
                            </button>
                            <button onclick="openServiceModal()" class="p-3 bg-zinc-800 hover:bg-primary/20 border border-zinc-700 hover:border-primary rounded-lg text-left transition group">
                                <i class="fa-solid fa-file-circle-plus text-primary text-lg mb-2 block"></i>
                                <span class="text-xs font-semibold text-white group-hover:text-primary">Registrar Servicio</span>
                            </button>
                            <button onclick="navigate('services')" class="p-3 bg-zinc-800 hover:bg-primary/20 border border-zinc-700 hover:border-primary rounded-lg text-left transition group">
                                <i class="fa-solid fa-clock text-primary text-lg mb-2 block"></i>
                                <span class="text-xs font-semibold text-white group-hover:text-primary">Servicios Pendientes</span>
                            </button>
                            <button onclick="navigate('catalog')" class="p-3 bg-zinc-800 hover:bg-primary/20 border border-zinc-700 hover:border-primary rounded-lg text-left transition group">
                                <i class="fa-solid fa-tags text-primary text-lg mb-2 block"></i>
                                <span class="text-xs font-semibold text-white group-hover:text-primary">Consultar Tarifas</span>
                            </button>
                            <button onclick="navigate('clients')" class="p-3 bg-zinc-800 hover:bg-primary/20 border border-zinc-700 hover:border-primary rounded-lg text-left transition group">
                                <i class="fa-solid fa-magnifying-glass text-primary text-lg mb-2 block"></i>
                                <span class="text-xs font-semibold text-white group-hover:text-primary">Buscar Cliente</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= MÓDULO CLIENTES =================
        function renderClients() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-search absolute left-3 top-3 text-secondary"></i>
                            <input type="text" id="clientSearch" oninput="filterClients(this.value)" placeholder="Buscar cliente por nombre o teléfono..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-primary">
                        </div>
                        <button onclick="openClientModal()" class="bg-primary hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> Nuevo Cliente / Prospecto
                        </button>
                    </div>

                    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-lg">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-zinc-800 text-secondary text-xs uppercase border-b border-zinc-700">
                                        <th class="p-3">ID</th>
                                        <th class="p-3">Nombre Completo</th>
                                        <th class="p-3">Teléfono / WhatsApp</th>
                                        <th class="p-3">Correo</th>
                                        <th class="p-3">Ciudad / Dirección</th>
                                        <th class="p-3">Tipo</th>
                                        <th class="p-3 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="clientsTableBody" class="divide-y divide-zinc-800">
                                    ${generateClientsTableRows(appState.clients)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateClientsTableRows(clients) {
            if (clients.length === 0) {
                return `<tr><td colspan="7" class="p-6 text-center text-secondary">No se encontraron clientes registrados.</td></tr>`;
            }
            return clients.map(c => `
                <tr class="hover:bg-zinc-800/50 transition">
                    <td class="p-3 font-mono text-secondary">#${c.id}</td>
                    <td class="p-3 font-semibold text-white">${c.name}</td>
                    <td class="p-3"><a href="https://wa.me/57${c.phone}" target="_blank" class="text-green-400 hover:underline"><i class="fa-brands fa-whatsapp mr-1"></i>${c.phone}</a></td>
                    <td class="p-3 text-gray-300">${c.email}</td>
                    <td class="p-3 text-gray-400">${c.city} - ${c.address || 'N/A'}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded text-xs font-semibold ${c.type === 'Prospecto' ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30' : 'bg-primary/20 text-primary border border-primary/30'}">
                            ${c.type}
                        </span>
                    </td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="viewClientHistory(${c.id})" class="text-secondary hover:text-white p-1" title="Ver historial"><i class="fa-solid fa-clock-rotate-left"></i></button>
                        <button onclick="editClient(${c.id})" class="text-secondary hover:text-white p-1" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterClients(query) {
            const q = query.toLowerCase();
            const filtered = appState.clients.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q));
            document.getElementById('clientsTableBody').innerHTML = generateClientsTableRows(filtered);
        }

        // ================= MÓDULO SOLICITUDES Y SERVICIOS =================
        function renderServices() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-search absolute left-3 top-3 text-secondary"></i>
                            <input type="text" id="serviceSearch" oninput="filterServices(this.value)" placeholder="Buscar por ticket, cliente o equipo..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-primary">
                        </div>
                        <button onclick="openServiceModal()" class="bg-primary hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-file-circle-plus"></i> Registrar Nuevo Servicio
                        </button>
                    </div>

                    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-lg">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-zinc-800 text-secondary text-xs uppercase border-b border-zinc-700">
                                        <th class="p-3">Ticket</th>
                                        <th class="p-3">Cliente</th>
                                        <th class="p-3">Tipo Asistencia</th>
                                        <th class="p-3">Fecha / Hora</th>
                                        <th class="p-3">Estado</th>
                                        <th class="p-3 text-right">Gestión / Checklist / Tickets</th>
                                    </tr>
                                </thead>
                                <tbody id="servicesTableBody" class="divide-y divide-zinc-800">
                                    ${generateServicesTableRows(appState.services)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateServicesTableRows(services) {
            if (services.length === 0) {
                return `<tr><td colspan="6" class="p-6 text-center text-secondary">No hay solicitudes de servicio registradas.</td></tr>`;
            }
            return services.map(s => {
                const client = appState.clients.find(c => c.id == s.clientId) || { name: 'Cliente Desconocido' };

        function saveDepartureChecklist(e, serviceId) {

            service.status = 'Realizado';
            saveData();
            closeModal();
            alert('¡Lista de chequeo de salida guardada y servicio actualizado a "Realizado" con éxito!');
